            /*display: flex;*/

        /* Estilos de la barra de navegación */
        .navbar {
            background-color: #333;

            justify-content: space-between;

            padding: 0 20px;
            flex-wrap: wrap; /* Permite que los elementos del menú se envuelvan a la siguiente línea si es necesario */

        .navbar a {
            display: block;

        /* Estilos para el dropdown */
        .dropdown {
            position: relative;
        }

        /* Botón para abrir el dropdown */
        .dropdown .dropbtn {
            font-size: 16px;
            border: none;
            outline: none;
            color: white;
            padding: 14px 20px;
            background-color: inherit;
            font-family: inherit;
            margin: 0;
        }

        /* Estilo de enlace cuando se pasa el cursor por encima */
        .navbar a:hover, .dropdown:hover .dropbtn {
            background-color: red;
        }

        /* Contenido del dropdown oculto inicialmente */
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;

        }

        /* Cambiar color de fondo al pasar el cursor sobre los enlaces del dropdown */

        }

        /* Estilos responsivos para pantallas pequeñas */
        @media screen and (max-width: 600px) {
            /* Ocultar enlaces excepto el primero y el ícono de menú */
            .navbar a:not(:first-child), .dropdown .dropbtn {
                display: none;
            }

            /* Estilos cuando el menú se vuelve responsivo */

                position: relative;
                flex-direction: column;

                position: absolute;
                right: 0;
                top: 0;
            }

            /* Mostrar todos los enlaces en bloques en el modo responsivo */
            .navbar.responsive a {
                float: none;
                display: block;
                text-align: left;
            }

            /* Ajustar el dropdown al modo responsivo */
            .navbar.responsive .dropdown {
                float: none;
            }

            .navbar.responsive .dropdown-content {
                position: relative;

            }

            .navbar.responsive .dropdown .dropbtn {
                display: block;
                width: 100%;
                text-align: left;
            }
        }

    <script>
    
        const activeModals = {}; // Objeto para mantener el seguimiento de las ventanas emergentes activas
        let currentLineState = {};// Mantener el estado actual de las líneas para determinar si se necesita redibujar

        function fetchActiveConfig() {
            const url = `configuracion_activa.txt?t=${new Date().getTime()}`; // Añadir un timestamp para evitar caché
            console.log('Fetching config from URL:', url); // Depuración para ver la URL completa
            return fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.text();
                })
                .then(file => {
                    const trimmedFile = file.trim();
                    console.log('Contenido de file después de trim:', trimmedFile); // Verificar contenido después de trim
                    return trimmedFile;
                })
                .catch(error => {
                    console.error('Error fetching configuration:', error); // Capturar errores de red o de fetch
                    throw error; // Re-lanzar el error para manejarlo en la llamada
                });
        }
        
        function loadConfigFile(file) {
            // Eliminar cualquier script antiguo
            document.querySelectorAll('script[data-config]').forEach(script => script.remove());

            // Cargar el nuevo script de configuración
            const newScript = document.createElement("script");
            newScript.src = `configuraciones/${file}`;
            newScript.setAttribute('data-config', file);
            newScript.onload = () => {
                initializeApp();
            };
            document.head.appendChild(newScript);

            console.log(`Cargado archivo de configuración: ${file}`);
        }

        function initializeApp() {
            // reinicializo aplicación con la nueva configuración
            console.log('Aplicación inicializada con la nueva configuración');
            // Llama a tus funciones de inicialización aquí
            

            init();
            //console.log("CONFIG:",config);
            
            initMQTT(); // Inicializo conexion MQTT

            // Cargar las gráficas usando la configuración
            if (typeof config !== 'undefined' && config.graficas) {
                loadCharts(config.graficas);
            } else {
                console.error('Configuración de gráficas no encontrada.');
            }
            
            //createAndPositionLines();

            generateMenu(config.menu_web);

            const blockMargin = config.blockMargin || '20px 20px';
            const styleSheet = document.getElementById('dynamicStyles').sheet;

            styleSheet.insertRule(`.block { margin: ${blockMargin}; }`, styleSheet.cssRules.length);
        }

        function NuevaConfiguracion(button) {
            // Desactivar el botón para evitar múltiples clics
            button.disabled = true;

            fetchActiveConfig().then(activeFile => {
                fetch('configuraciones/')
                    .then(response => response.text())
                    .then(data => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(data, "text/html");
                        const links = doc.querySelectorAll('a');
                        const configFiles = Array.from(links).map(link => link.getAttribute('href')).filter(file => file.endsWith('.js'));

                        displayConfigOptions(configFiles, activeFile, button); // Pasar el archivo activo y el botón a la función
                    });
            });
        }

        function displayConfigOptions(configFiles, activeFile, button) {
            let existingContainer = document.getElementById('configOptionsContainer');
            if (existingContainer) {
                existingContainer.remove();
            }

            const container = document.createElement("div");
            container.id = "configOptionsContainer";

            configFiles.forEach(file => {
                const optionButton = document.createElement("button");

                // Resaltar el archivo de configuración activo
                if (file === activeFile) {
                    optionButton.textContent = `${file} (Activo)`;
                    optionButton.style.fontWeight = "bold";
                    optionButton.style.backgroundColor = "#cae8cf"; // Fondo más claro
                    optionButton.style.color = "#000"; // Texto negro
                } else {
                    optionButton.textContent = file;
                }

                optionButton.onclick = () => {
                    updateActiveConfigFile(file);
                    button.disabled = false; 
                    container.remove();
                };

                container.appendChild(optionButton);
            });

            // Añadir botón para mantener la configuración actual
            const keepCurrentButton = document.createElement("button");
            keepCurrentButton.textContent = `Mantener ${activeFile}`;
            keepCurrentButton.style.fontWeight = "bold";
            keepCurrentButton.style.backgroundColor = "#d9edf7"; // Color de fondo para diferenciar
            keepCurrentButton.style.color = "#31708f"; // Color de texto
            keepCurrentButton.onclick = () => {
                button.disabled = false;
                container.remove();
            };

            container.appendChild(keepCurrentButton);

            // Insertar el contenedor justo después del botón "Cambiar Configuración"
            button.parentNode.insertBefore(container, button.nextSibling);
        }


        function updateActiveConfigFile(file) {
            console.log('Intentando grabar archivo', file);

            fetch('configuracion_actualizacion.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ file })
            })
            .then(response => {
                console.log(response);

                if (response.ok) {
                    console.log('grabado archivo', file);
                    
                    // Agregar un retraso antes de recargar
                    setTimeout(() => {
                        window.location.href = window.location.href.split('?')[0];
                    }, 50); // retraso de X milisegundos
                } else {
                    console.error('Error al actualizar el archivo de configuración');
                }
            });
        }


        document.addEventListener("DOMContentLoaded", function() {
            
            // Crear el botón de conexión MQTT
            const connectBtn = document.createElement("button");
            connectBtn.id = "connectBtn";
            connectBtn.className = "btn disconnected";
            connectBtn.innerHTML = "MQTT Conectado";

            };

            const configBtn = document.createElement("button");
            configBtn.id = "configBtn";
            configBtn.className = "btn connected";
            configBtn.innerHTML = "Cambiar Configuracion";

            //button.textContent = "Cambiar Configuración";
            configBtn.onclick = () => NuevaConfiguracion(configBtn);
            document.body.appendChild(configBtn);
         
            fetchActiveConfig()
                .then(file => {
                    console.log('Configuración activa obtenida:', file); // Confirmar el valor recibido de file
                    loadConfigFile(file);
                })
                .catch(error => {
                    console.error('Error al cargar la configuración activa:', error); // Manejo de errores
                });
                
            crearModalWeb(); // Crear la modal
               
        });


        // Función para hacer una ventana modal arrastrable
        function makeDraggable(element) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            var header = element.querySelector(".modal-header");

            // Selecciona el botón de cierre
            var closeButton = element.querySelector('.modal-close-web');

            // Asignamos el arrastre solo si el clic o toque no es en el botón de cierre
            if (header) {
                header.onmousedown = function(e) {
                    if (!e.target.classList.contains('modal-close-web')) {
                        dragMouseDown(e);
                    }
                };
                header.ontouchstart = function(e) {
                    if (!e.target.classList.contains('modal-close-web')) {
                        dragTouchStart(e);
                    }
                };
            } else {
                element.onmousedown = function(e) {
                    if (!e.target.classList.contains('modal-close-web')) {
                        dragMouseDown(e);
                    }
                };
                element.ontouchstart = function(e) {
                    if (!e.target.classList.contains('modal-close-web')) {
                        dragTouchStart(e);
                    }
                };
            }

            function dragMouseDown(e) {
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                e.preventDefault();
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementTouchDrag;
            }

            function elementDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function elementTouchDrag(e) {
                e.preventDefault();
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                element.style.top = (element.offsetTop - pos2) + "px";
                element.style.left = (element.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }



        // Función para generar el menú
        function generateMenu(menuConfig) {
            const navbar = document.getElementById('navbar');
            Object.keys(menuConfig).forEach(menuItem => {
                if (typeof menuConfig[menuItem] === 'string') {
                    const link = document.createElement('a');
                    link.href = menuConfig[menuItem];
                    link.textContent = menuItem;
                    navbar.appendChild(link);
                } else {
                    const dropdown = document.createElement('div');
                    dropdown.className = 'dropdown';
                    const dropbtn = document.createElement('button');
                    dropbtn.className = 'dropbtn';
                    dropbtn.textContent = menuItem;
                    dropdown.appendChild(dropbtn);
                    const dropdownContent = document.createElement('div');
                    dropdownContent.className = 'dropdown-content';
                    Object.keys(menuConfig[menuItem]).forEach(subMenuItem => {
                        const subLink = document.createElement('a');
                        subLink.href = menuConfig[menuItem][subMenuItem];
                        subLink.textContent = subMenuItem;
                        dropdownContent.appendChild(subLink);
                    });
                    dropdown.appendChild(dropdownContent);
                    navbar.appendChild(dropdown);
                }
            });
        }

            } else {
                navbar.className = "navbar";

        }

        function createElement(elementConfig, blockId, elementId) {
            if (elementConfig.visualizacion === 'nunca' || elementConfig.visualizacion === 'modal') return;

            const elementDiv = document.createElement('div');
            elementDiv.className = 'element';
            elementDiv.id = `${blockId}-${elementId}`;

            // Verificar y asignar valores por defecto
            if (!elementConfig.position) elementConfig.position = { x: 0, y: 0 };
            
            if (!elementConfig.value) elementConfig.value = 0;
            if (!elementConfig.unit) elementConfig.unit = '';
            if (!elementConfig.background) elementConfig.background = 'transparent';
            
            if (elementConfig.bold) {
                elementDiv.style.fontWeight = 'bold';
            } else {
                elementDiv.style.fontWeight = 'normal';
            }
            
            
            elementDiv.style.position = 'absolute';
            elementDiv.style.left = `${elementConfig.position.x}px`;
            elementDiv.style.top = `${elementConfig.position.y}px`;
            elementDiv.style.width = `${elementConfig.width}px`;
            elementDiv.style.backgroundColor = elementConfig.backgroundColor;
            elementDiv.style.color = elementConfig.valueColor;
            elementDiv.style.fontSize = elementConfig.size;
            
            
            // Verificar el atributo showTitle y mostrar el título si corresponde
            if (elementConfig.showTitle !== false) {
                const title = document.createElement('div');
                title.innerText = elementId + ': ';
                title.style.color = elementConfig.titleColor;
                elementDiv.appendChild(title);
            }
            
            const value = document.createElement('div');
            value.className = 'value';

            // Verificar si el valor es un número y formatearlo con separador de miles ,comas y maximo 3 decimales
            let displayValue = elementConfig.value;
            if (typeof displayValue === 'number') {
                displayValue = displayValue.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 3 });                        
            }

            value.innerText = displayValue + ' ' + elementConfig.unit;
            value.style.color = elementConfig.valueColor;
            elementDiv.appendChild(value);

            const blockDiv = document.getElementById(blockId);
            blockDiv.appendChild(elementDiv);
                        
        }

        function createAndPositionLines() {
            const svg = document.getElementById('svgLines');

            // Crear un mapa de líneas actuales
            const existingLines = new Map();
            svg.querySelectorAll('line').forEach(line => {
                const id = line.getAttribute('id');
                existingLines.set(id, line);
            });

            Object.keys(config.filas).forEach(rowId => {
                const rowConfig = config.filas[rowId];
                Object.keys(rowConfig).forEach(blockId => {
                    const blockConfig = rowConfig[blockId];

                    if (!blockConfig.connectTo) {
                        // Si no existe connectTo, saltar este bloque
                        return;
                    }

                    // Función para procesar cada conexión
                    const processConnection = (connection, key) => {
                        try {
                            // Verificar y asignar valores por defecto
                            if (!connection.from) connection.from = 'bottom';
                            if (!connection.to) connection.to = 'top';
                            if (!connection.colorLineaPositiva) connection.colorLineaPositiva = 'black';
                            if (!connection.colorLineaNegativa) connection.colorLineaNegativa = 'red';
                            if (!connection.flujoLinea) connection.flujoLinea = 'normal';

                            const fromBlock = document.getElementById(blockId);
                            const toBlock = document.getElementById(connection.id);

                            if (fromBlock && toBlock) {
                                let fromX, fromY, toX, toY;
                                if (connection.flujoLinea === 'normal') {
                                    ({ x: fromX, y: fromY } = calculateConnectionCoords(fromBlock, connection.from));
                                    ({ x: toX, y: toY } = calculateConnectionCoords(toBlock, connection.to));
                                } else if (connection.flujoLinea === 'inverso') {
                                    ({ x: fromX, y: fromY } = calculateConnectionCoords(toBlock, connection.to));
                                    ({ x: toX, y: toY } = calculateConnectionCoords(fromBlock, connection.from));
                                }

                                try {
                                    const lineKey = `${blockId}-${connection.id}`;
                                    const valor = blockConfig.elements[connection.control].value;
                                    const controlValue = Math.abs(valor);

                                    const newCoords = { fromX, fromY, toX, toY };
                                    const strokeWidth = Math.max(2, Math.min(15, (controlValue - connection.min) / (connection.max - connection.min) * 13 + 2));

                                    // Verificar si las coordenadas o el valor de control han cambiado
                                    const currentState = currentLineState[lineKey] || {};
                                    if (!currentState.coords || !currentState.controlValue ||
                                        currentState.coords.fromX !== fromX || currentState.coords.fromY !== fromY ||
                                        currentState.coords.toX !== toX || currentState.coords.toY !== toY ||
                                        currentState.valor !== valor) {//currentState.controlValue !== controlValue) {

                                        //currentLineState[lineKey] = { coords: newCoords, controlValue };
                                        currentLineState[lineKey] = { coords: newCoords, valor };

                                        let line = existingLines.get(lineKey);
                                        if (!line) {
                                            line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                                            line.setAttribute('id', lineKey);
                                            svg.appendChild(line);
                                        }

                                        line.setAttribute('x1', fromX);
                                        line.setAttribute('y1', fromY);
                                        line.setAttribute('x2', toX);
                                        line.setAttribute('y2', toY);
                                        line.setAttribute('stroke-width', strokeWidth);

                                        // Check if value is 0 and apply the appropriate class
                                        if (valor === 0) {
                                            line.setAttribute('class', 'line_inactive');
                                            line.removeAttribute('style');
                                        } else {
                                            const color = valor >= 0 ? connection.colorLineaPositiva : connection.colorLineaNegativa;
                                            const animation = valor >= 0 ? 'dash_normal' : 'dash_inverso';
                                            line.setAttribute('class', 'line');
                                            line.setAttribute('style', `stroke: ${color}; animation-name: ${animation};`);
                                        }
                                    }

                                    // Eliminar de existingLines ya procesados
                                    existingLines.delete(lineKey);
                                } catch (error) {
                                    console.error('Conexion ', blockId, connection.id);
                                    console.error('Variable control:', connection.control, ' =', blockConfig.elements[connection.control]);
                                    console.error('Comprueba que los bloques existen y la variable de control esta bien definida');
                                    console.error('  -> Error creacion Linea ', error);
                                }
                            }
                        } catch (error) {
                            console.error('Conexion ', blockId, 'Revisar parametros creacion linea a', connection);
                            console.error('  -> Error creacion Linea ', error);
                        }
                    };

                    // Detectar si connectTo es un solo objeto (antiguo formato) o un objeto con múltiples conexiones (nuevo formato)
                    if (blockConfig.connectTo.id) {
                        // Formato antiguo (única línea)
                        processConnection(blockConfig.connectTo, 'single');
                    } else {
                        // Formato nuevo (múltiples líneas)
                        Object.keys(blockConfig.connectTo).forEach(key => {
                            processConnection(blockConfig.connectTo[key], key);
                        });
                    }
                });
            });

            // Remover las líneas que ya no son necesarias
            existingLines.forEach(line => {
                svg.removeChild(line);
            });
        }

        function calculateConnectionCoords(block, position) {
            const rect = block.getBoundingClientRect();
            const svgRect = document.getElementById('svgLines').getBoundingClientRect();

            let x, y;

            switch (position) {
                case 'top':
                    x = rect.left + (rect.width / 2) - svgRect.left;
                    y = rect.top - svgRect.top;
                    break;
                case 'bottom':
                    x = rect.left + (rect.width / 2) - svgRect.left;
                    y = rect.bottom - svgRect.top;
                    break;
                case 'left':
                    x = rect.left - svgRect.left;
                    y = rect.top + (rect.height / 2) - svgRect.top;
                    break;
                case 'right':
                    x = rect.right - svgRect.left;
                    y = rect.top + (rect.height / 2) - svgRect.top;
                    break;
                default:
                    x = rect.left + (rect.width / 2) - svgRect.left;
                    y = rect.top + (rect.height / 2) - svgRect.top;
                    break;
            }

            return { x, y };
        }

                    button.style.margin = '5px';
                    
                    if (comandoConfig.requiereClave) {
                        button.classList.add('boton-con-clave');
                    }

                    // Evento para enviar el comando MQTT
                    button.addEventListener('click', () => {
                        if (comandoConfig.requiereClave) {
                            const clave = sessionStorage.getItem('userClave');
                            if (!clave) {
                                solicitarClave().then((userClave) => {
                                    sessionStorage.setItem('userClave', userClave);
                                    enviarComandoMQTT(comandoConfig, userClave);
                                }).catch(() => {
                                    alert('Clave incorrecta o cancelada');
                                });
                            } else {
                                enviarComandoMQTT(comandoConfig, clave);
                            }
                        } else {
                            enviarComandoMQTT(comandoConfig);
                        }
                    });

                    // Añadir el botón a la fila correspondiente
                    filas[fila].appendChild(button);
                });
            }

            Object.keys(blockConfig.elements).forEach(elementId => {
                const elementConfig = blockConfig.elements[elementId];
                if (elementConfig.visualizacion != 'nunca') {
                    const elementDiv = document.createElement('div');
                    elementDiv.id = `M-${blockId}-${elementId}`;
                    
                    let value = elementConfig.value;
                    
                    if (typeof value === 'number') {
                        value = value.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
                    }   
                    
                    let salida =  `<span style="color: red">${elementId}:</span> <span style="color: black">${value} ${elementConfig.unit}</span>`;
                    
                    elementDiv.innerHTML = salida;
                    
                    modalDiv.appendChild(elementDiv);
                }
            });

            const offset = 10; // Desplazamiento a la derecha
            const modalHeight = modalDiv.offsetHeight; // Obtener la altura del modal
            const modalWidth = modalDiv.offsetWidth;
            
            console.log('modalHeight:', modalHeight );
            console.log('scrollY:', window.scrollY );

            // Posicionar el modal a la derecha del bloque y a la misma altura
            const topPosition = rect.top + window.scrollY;
            const leftPosition = rect.left + window.scrollX + blockDiv.offsetWidth + offset;

            // Ajustar la posición teniendo en cuenta el `transform: translate(-50%, -50%)`
            modalDiv.style.top = `${topPosition + modalHeight / 2 + 50}px`;
            modalDiv.style.left = `${leftPosition - modalWidth / 2}px`;
            
            // Registrar la ventana modal activa
            activeModals[blockId] = {
                modalContainer: modalDiv,
                blockConfig: blockConfig
            };

            // Hacer la ventana modal arrastrable
            makeDraggable(modalDiv);

            fetchAndUpdateData();
        }

                        else if (elementConfig.campoBD) value =  getValueFromData(data, elementConfig.campoBD);

                            let salida =  `<span style="color: red">${elementId}:</span> <span style="color: black">${value_adap} ${elementConfig.unit}</span>`;
                                
                            // Verificar avisos y mostrar condicion de aviso
                            if (elementConfig.avisos) {
                                const blockDiv = document.getElementById(blockId);

                                    if (condicion(value, data, now)) {
                                        salida += `<br><span style="color: magenta">&emsp;${key}-> </span>`;
                                        salida += `<span style="color: blue">${aviso.condicion}</span>`;

        function solicitarClave() {
            return new Promise((resolve, reject) => {
                const claveIngresada = prompt('Por favor, introduce la clave:');
                if (claveIngresada === config.MQTT.clave_web) {  // Compara con la clave_web del archivo de configuración
                    resolve(claveIngresada);
                } else {
                    reject('Clave incorrecta');
                }
            });
        }

        let mensajeHistorial = ''; // Variable global para acumular el historial de mensajes
        let modalDiv; // Variable para la modal
        
        // Crear la modal una sola vez
        function crearModalWeb() {
            modalDiv = document.createElement('div');
            modalDiv.className = 'modal-web';
            document.body.appendChild(modalDiv);

            const headerDiv = document.createElement('div');
            headerDiv.className = 'modal-header-web';

            const titleSpan = document.createElement('span');
            titleSpan.className = 'modal-title-web';

            const closeButton = document.createElement('div');
            closeButton.innerHTML = `&nbsp;X&nbsp;`;
            closeButton.className = 'modal-close-web';
            closeButton.style.cursor = 'pointer';

            closeButton.addEventListener('click', () => {
                modalDiv.style.display = 'none'; // Ocultar la modal en lugar de eliminarla
            });

            // Añadir evento para cerrar con doble clic en cualquier parte del modal
            modalDiv.addEventListener('dblclick', () => {
                modalDiv.style.display = 'none';
            });

            headerDiv.appendChild(titleSpan);
            headerDiv.appendChild(closeButton);
            modalDiv.appendChild(headerDiv);

            const contentDiv = document.createElement('div');
            contentDiv.className = 'modal-content-web'; // Clase CSS para contenido
            modalDiv.appendChild(contentDiv);

            // Botón para borrar el texto
            const clearButton = document.createElement('button');
            clearButton.innerHTML = "Borrar texto";
            clearButton.className = 'modal-clear-btn-web';
            
            
            clearButton.onclick = () => {
                mensajeHistorial = ""; // Borrar el historial
                contentDiv.innerHTML = ""; // Borrar el contenido
            };

            modalDiv.appendChild(clearButton);
            modalDiv.style.display = 'none'; // Inicialmente ocultar la modal
            
            // Hacer la ventana modal arrastrable
            makeDraggable(modalDiv);
        }

        // Función para mostrar la ventana modal "modal-web"
        function mostrarModalWeb(titulo, contenido, tiempo = null) {
            const header = modalDiv.querySelector('.modal-title-web');
            const contentDiv = modalDiv.querySelector('.modal-content-web');

            header.innerHTML = `&nbsp;${titulo}&nbsp;`;
            mensajeHistorial = `${contenido}<br>`;
            
            // Limitar el historial a 3000 caracteres
            // (mensajeHistorial.length > 3000) {
                //nsajeHistorial = mensajeHistorial.substring(mensajeHistorial.length - 3000); // Mantener los últimos 3000 caracteres
            //

            contentDiv.innerHTML = mensajeHistorial; // Mostrar todo el historial de mensajes

            modalDiv.style.display = 'block'; // Mostrar la modal

            // Si se especifica un tiempo, cerrar automáticamente después de 10 segundos
            if (tiempo) {
                setTimeout(() => {
                    modalDiv.style.display = 'none'; // Ocultar la modal
                }, tiempo);
            }

            // Desplazar hacia abajo el contenido para mostrar los últimos mensajes
            contentDiv.scrollTop = contentDiv.scrollHeight;
        }
        
        function enviarComandoMQTT(comandoConfig, clave = null) {
            if (!mqttClient || !mqttClient.isConnected()) {
                console.error('MQTT no está conectado');
                mostrarModalWeb("Error de conexión", "No se pudo conectar con el broker MQTT.");
                return;
            }

            const topic = comandoConfig.topic;
            const comando = comandoConfig.comando;

            const message = new Paho.MQTT.Message(comando);
            message.destinationName = topic;
            mqttClient.send(message);
            
            // Mostrar información en la ventana modal
            const fechaHora = new Date().toLocaleString(); // Obtener fecha y hora actual
            const infoMensaje = `Fecha y Hora: ${fechaHora}<br>Topic: ${topic}<br>Payload: ${comando}`;
            mostrarModalWeb("Comando MQTT enviado", infoMensaje, 10000);

            console.log(`MQTT enviado: ${comando} al topic: ${topic}`);
        }

        let mqttClient;
        let isConnected = false;

        function initMQTT() {
            try {
                console.log('Inicio conexion MQTT....');
                if (!config.MQTT) {
                    console.log('No esta configurado MQTT');
                    return;
                }
                const {servidor, puerto, usuario, clave} = config.MQTT;
                
                console.log('servidor: ',servidor);
                
                // Verificar si alguna propiedad no está definida o es nula
                if (!servidor || !puerto || !usuario || !clave) {
                    console.error('Error: Uno o más campos de la configuración MQTT no están definidos. -- MQTT no se usará');
                    return; // Salir de la función si falta algún valor
                }


                // chequear de que servidor es un objeto con varias IPs o una unica IP
                const servidores = typeof servidor === 'object' ? Object.values(servidor) : [servidor];

                console.log('servidores: ',servidores);
                

                // Función auxiliar para intentar la conexión
                function intentarConexion(index) {
                    if (index >= servidores.length) {
                        console.error('Error: No se pudo establecer conexión con ninguno de los servidores MQTT');
                        return;
                    }

                    const servidorActivo = servidores[index];
                    console.log('Activo: ',servidorActivo);
                
                    const clienteUnicoId = "clientId_" + new Date().getTime();
                    mqttClient = new Paho.MQTT.Client(servidorActivo, Number(puerto), '/mqtt', clienteUnicoId);

                    const options = {
                        userName: usuario,
                        password: clave,
                        onSuccess: () => {
                            onConnect();
                            mqttClient.onConnectionLost = onFailure;  // Reasigna onFailure para futuras pérdidas de conexión
                            
                            // Actualizar el estado del botón
                            updateButtonState();
                            checkMQTTConnection();
                        
                        },
                        onFailure: () => {
                            console.warn(`Fallo en la conexión a ${servidorActivo}, intentando siguiente...`);
                            intentarConexion(index + 1); // Intentar con el siguiente servidor
                        }
                    };

                    console.log(`Intentando conectar a ${servidorActivo}...`);
                    mqttClient.connect(options);
                }

                // Iniciar el proceso de conexión
                intentarConexion(0);
                
                mqttClient.onMessageArrived = function (message) {
                    console.log("MQTT recibido:", message.payloadString);
                    const fechaHora = new Date().toLocaleString(); // Obtener fecha y hora actual
                    const infoMensaje = `Fecha y Hora: ${fechaHora}<br>Topic: ${message.destinationName}<br>Payload: ${message.payloadString}`;

                    // Acumular mensajes en el historial
                    mensajeHistorial += `${infoMensaje}<br>`;
                    // Limitar el historial a 3000 caracteres
                    if (mensajeHistorial.length > 3000) {
                        mensajeHistorial = mensajeHistorial.substring(mensajeHistorial.length - 3000); // Mantener los últimos 3000 caracteres
                    }

                    // Mostrar el historial en la ventana modal
                    mostrarModalWeb("Mensajes recibidos", mensajeHistorial, null); // No ocultar automáticamente
                };
            
                console.log('..... Fin initMQTT()');
                
            } catch (error) {
                // Capturar cualquier error y mostrarlo en la consola
                console.error("Error en la inicialización de MQTT:", error.message);
                return; // Salir de la función en caso de error
            }
        }

        function onConnect() {
            console.log("Conectado a MQTT");
            isConnected = true;
            updateButtonState(); // Cambia el estado del botón a verde
            
            mqttClient.subscribe('PVControl/WEB', (err) => {
                if (err) {
                    mostrarModalWeb("Error de suscripción", "No se pudo suscribir al topic PVControl/WEB.");
                }
            });
        }

        function onFailure(error) {
            console.error("Error al conectar a MQTT:", error);
            isConnected = false;
            updateButtonState(); // Cambia el estado del botón a rojo       
            mostrarModalWeb("Error de conexión", "No se pudo conectar al broker MQTT.", 10000);
        }
        
        // Función que actualiza el color del botón MQTT
        function updateButtonState() {
            const connectBtn = document.getElementById("connectBtn");
            if (isConnected) {
                connectBtn.classList.remove("disconnected");
                connectBtn.classList.add("connected");
                connectBtn.innerHTML = "Conectado MQTT";
            } else {
                connectBtn.classList.remove("connected");
                connectBtn.classList.add("disconnected");
                connectBtn.innerHTML = "Reconectar MQTT";
            }
        }
        
        function checkMQTTConnection() {
            // Verificar cada X segundos si el cliente sigue conectado
            setInterval(function() {
                if (mqttClient.isConnected()) {
                    console.log("Conexión MQTT activa...");
                    // Aquí se podría actualizar visualmente un botón o mostrar un mensaje
                } else {
                    console.log("Conexión MQTT perdida. Intentando reconectar...");
                    // Intentar reconectar si no está conectado
                    reconnectMQTT();
                }
            }, 20000);  // 20000 ms = 20 segundos
        }

        function reconnectMQTT() {
            const options = {
                userName: config.MQTT.usuario,
                password: config.MQTT.clave,
                onSuccess: onConnect,
                onFailure: onFailure
            };

            if (!mqttClient.isConnected()) {
                mqttClient.connect(options);
            }
        }


    </script>

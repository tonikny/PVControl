   <script
   type="text/javascript"
   id="script46"><![CDATA[


document.Animation = function(Power, MaxPower) 
{

	var DirStr = "";
	var text_id ="";
	var luz_id 	= "";
	
	bubble_id = "bubble_cons_anim";
	
	speed_0 = document.getElementById(bubble_id).getAttribute("dur");
	speed_0 = speed_0.substr(0, speed_0.length-1);
	
	if( MaxPower == 0 ) // div by zero
		MaxPower = 10000; // 10 kW
	
	TmpPower = Math.abs(Power);
	if( TmpPower > MaxPower )
		TmpPower = MaxPower;
	max_speed = 0.4; // 0.4 s bubble speed
	min_speed = 10.0; // min bubble speed 3 seconds
	speed = (TmpPower/MaxPower) * (max_speed-min_speed) + min_speed;
	speed_1 = speed;
	speed = String(speed) + "s";
	
	if (Power > 0)
		DirStr = "0;1";
	else if (Power < 0)
		DirStr = "1;0";
		
	document.getElementById("svg9").setCurrentTime(document.getElementById("svg9").getCurrentTime() * speed_1 / speed_0);

	document.getElementById(bubble_id).setAttribute("keyPoints", DirStr);
	
	document.getElementById(bubble_id).setAttribute("dur", speed);
	
}

]]></script>
   
   

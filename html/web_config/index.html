<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Configuración PVControl+</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tree.css">
    <link rel="stylesheet" href="css/editor.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Incluir Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js" type="text/javascript" charset="utf-8"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ext-language_tools.js"></script>
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-left">
                <h1><i class="fas fa-solar-panel"></i> PVControl+ Config</h1>
                <span id="file-path" class="file-path">/home/pi/PVControl+/Parametros_FV_DIST_NUEVO.py</span>
            </div>
            <div class="header-right">
                <button id="btn-open" class="btn btn-secondary">
                    <i class="fas fa-folder-open"></i> Abrir
                </button>
                <button id="btn-validate" class="btn btn-warning">
                    <i class="fas fa-check-circle"></i> Verificar
                </button>
                <button id="btn-save" class="btn btn-primary">
                    <i class="fas fa-save"></i> Guardar
                </button>
            </div>
        </header>

        <div class="main-content">
            <div class="tree-panel">
                <div class="tree-header">
                    <input type="text" id="tree-search" placeholder="Buscar configuración...">
                    <button id="btn-collapse-all" class="btn-icon" title="Colapsar todo">
                        <i class="fas fa-compress-alt"></i>
                    </button>
                </div>
                <div id="config-tree" class="config-tree"></div>
            </div>

            <div class="editor-panel">
                <div id="editor-header" class="editor-header">
                    <h2 id="section-title">Seleccione una sección</h2>
                    <div id="breadcrumb" class="breadcrumb"></div>
                </div>
                
                <div id="editor-content" class="editor-content">
                    <div id="empty-state" class="empty-state">
                        <i class="fas fa-cog fa-3x"></i>
                        <h3>Selecciona una sección del árbol</h3>
                        <p>Haz clic en cualquier elemento del árbol de configuración para editarlo</p>
                    </div>
                    
                    <!-- Cambiar el editor para usar Ace -->
                    <div id="config-editor" class="config-editor" style="display: none; height: calc(100vh - 200px);"></div>
                </div>
            </div>
        </div>

        <footer class="status-bar">
            <div id="status-message" class="status-message">Listo</div>
            <div class="status-actions">
                <span id="config-stats" class="config-stats">0 elementos</span>
            </div>
        </footer>
    </div>

    <script src="js/tree.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
